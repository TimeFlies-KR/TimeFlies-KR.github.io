<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글쓰기 — TimeFlies</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">

  <header>
    <h1 class="site-name"><a href="index.html">Time<span>Flies</span></a></h1>
    <nav>
      <a href="index.html">전체</a>
      <a href="write.html" class="active">글쓰기</a>
    </nav>
  </header>

  <form id="write-form">
    <fieldset>
      <legend>새 글</legend>

      <label for="title">제목</label>
      <input type="text" id="title" required>

      <label for="tag">태그</label>
      <select id="tag">
        <option value="게임개발">게임개발</option>
        <option value="음악">음악</option>
        <option value="일본어">일본어</option>
        <option value="Linux">Linux</option>
        <option value="기타">기타</option>
      </select>

      <label for="excerpt">한 줄 요약 (목록에 표시됨)</label>
      <input type="text" id="excerpt" required>

      <label for="body">본문 (문단 사이는 빈 줄로 구분)</label>
      <textarea id="body" required></textarea>
    </fieldset>

    <button type="submit">작성완료</button>
    <div id="status"></div>
  </form>

</div>

<script>
const $ = (id) => document.getElementById(id);

const TAG_COLORS = {
  '게임개발': 'var(--amber)',
  '일본어': 'var(--teal)',
  '음악': '#8B7EC8',
  'Linux': '#7C9E8F',
};
function tagStyle(tag) {
  const c = TAG_COLORS[tag] || 'var(--ink-dim)';
  return `style="color:${c};border-color:${c};"`;
}
function slugify(text) {
  text = text.replace(/[^\w\s\u3040-\u30FF\u4E00-\u9FFF\uAC00-\uD7A3-]/g, '').trim().toLowerCase();
  return text.replace(/\s+/g, '-') || 'post';
}
function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function pad(n) { return String(n).padStart(2, '0'); }

function buildPostHtml(title, dateStr, tag, bodyRaw) {
  const paragraphs = bodyRaw.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  const bodyHtml = paragraphs.map(p => `      <p>${escapeHtml(p)}</p>`).join('\n');

  return `<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${escapeHtml(title)} — TimeFlies</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="wrap">

  <header>
    <h1 class="site-name"><a href="../index.html">Time<span>Flies</span></a></h1>
    <nav>
      <a href="../index.html">← 목록으로</a>
    </nav>
  </header>

  <article class="post">
    <div class="date">${dateStr}</div>
    <span class="tag" ${tagStyle(tag)}>${escapeHtml(tag)}</span>
    <h1 class="post-title">${escapeHtml(title)}</h1>
    <div class="post-body">
${bodyHtml}
    </div>
  </article>

  <footer>
    <span>© 2026 TimeFlies</span>
    <div>
      <a href="../index.html">목록으로</a>
    </div>
  </footer>

</div>
</body>
</html>
`;
}

$('write-form').addEventListener('submit', (e) => {
  e.preventDefault();

  const title = $('title').value.trim();
  const tag = $('tag').value;
  const excerpt = $('excerpt').value.trim();
  const bodyRaw = $('body').value;

  if (!title || !excerpt || !bodyRaw.trim()) {
    $('status').textContent = '제목, 요약, 본문을 모두 입력해주세요.';
    $('status').style.color = '#C97B6B';
    return;
  }

  const now = new Date();
  const dateStr = `${now.getFullYear()}. ${pad(now.getMonth() + 1)}. ${pad(now.getDate())}`;
  const filename = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}-${slugify(title)}.html`;

  const html = buildPostHtml(title, dateStr, tag, bodyRaw);

  // .html 파일로 다운로드
  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  $('status').style.color = 'var(--teal)';
  $('status').innerHTML =
    `<strong>${filename}</strong> 다운로드 완료.<br>` +
    `이 파일을 <code>posts/</code> 폴더로 옮기고, index.html에 아래 링크를 추가하세요:<br><br>` +
    `<div class="entry" style="border:1px dashed var(--line); padding:12px; font-size:0.82rem;">` +
    `&lt;article class="entry"&gt;<br>` +
    `&nbsp;&nbsp;&lt;div class="date"&gt;${pad(now.getMonth() + 1)}. ${pad(now.getDate())}&lt;/div&gt;<br>` +
    `&nbsp;&nbsp;&lt;div&gt;<br>` +
    `&nbsp;&nbsp;&nbsp;&nbsp;&lt;span class="tag" ${tagStyle(tag)}&gt;${escapeHtml(tag)}&lt;/span&gt;<br>` +
    `&nbsp;&nbsp;&nbsp;&nbsp;&lt;h2&gt;&lt;a href="posts/${filename}"&gt;${escapeHtml(title)}&lt;/a&gt;&lt;/h2&gt;<br>` +
    `&nbsp;&nbsp;&nbsp;&nbsp;&lt;p&gt;${escapeHtml(excerpt)}&lt;/p&gt;<br>` +
    `&nbsp;&nbsp;&lt;/div&gt;<br>` +
    `&lt;/article&gt;` +
    `</div>`;

  $('write-form').reset();
});
</script>
</body>
</html>
